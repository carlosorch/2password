name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # macOS covers the clipboard and Keychain paths, which are skipped elsewhere.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # npm publish silently rewrites invalid package.json fields (it once dropped our bin).
      - run: npm pkg fix && git diff --exit-code package.json
